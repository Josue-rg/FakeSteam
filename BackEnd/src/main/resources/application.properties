spring.application.name=FakeSteam

# Puerto: Render asigna PORT por variable de entorno; local usa 5000
server.port=${PORT:5000}

# Base de datos PostgreSQL (Neon). En Render se define la variable DB_URL en el panel.
# El usuario y contraseña se extraen automáticamente del propio URL (formato Neon).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
